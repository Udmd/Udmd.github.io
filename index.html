<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 🐍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            padding: 25px 35px 35px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        h1 {
            color: #fff;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-size: 28px;
        }
        h1 span {
            font-weight: 700;
            color: #f1c40f;
        }
        .score-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #aaa;
            font-size: 18px;
            padding: 5px 5px 15px 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .score-box span {
            color: #f1c40f;
            font-weight: 700;
            font-size: 24px;
        }
        canvas {
            display: block;
            margin: 18px auto 0 auto;
            border-radius: 16px;
            background: #1e1e2f;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
            width: 400px;
            height: 400px;
            image-rendering: pixelated; /* 保持清晰 */
        }
        .control-hint {
            margin-top: 16px;
            color: #888;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .control-hint kbd {
            background: #2a2a3e;
            padding: 4px 10px;
            border-radius: 6px;
            color: #ddd;
            font-weight: 600;
            margin: 0 2px;
            border: 1px solid #444;
        }
        .btn-restart {
            margin-top: 12px;
            background: #f1c40f;
            border: none;
            color: #1e1e2f;
            font-weight: 700;
            font-size: 16px;
            padding: 8px 28px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3);
            letter-spacing: 1px;
        }
        .btn-restart:hover {
            background: #f39c12;
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(241, 196, 15, 0.5);
        }
        .btn-restart:active {
            transform: scale(0.95);
        }
        @media (max-width: 480px) {
            .game-container {
                padding: 15px 15px 25px 15px;
            }
            canvas {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🐍 贪吃<span>蛇</span></h1>
    <div class="score-box">
        <span>🍎 得分</span>
        <span id="scoreDisplay">0</span>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="control-hint">
        <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 控制方向
    </div>
    <button class="btn-restart" id="restartBtn">🔄 新一局</button>
</div>

<script>
    (function(){
        // ----- 配置 -----
        const BOARD_SIZE = 20;          // 20x20 网格
        const CELL_SIZE = 20;           // 像素 (400/20)
        const TICK_INTERVAL_MS = 150;   // 速度

        // ----- DOM 元素 -----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');

        // ----- 游戏状态 -----
        let snake = [];          // 坐标数组 [x,y]
        let food = { x: 8, y: 10 };
        let direction = 'right'; // 当前移动方向
        let nextDirection = 'right';
        let score = 0;
        let gameOver = false;
        let gameLoopInterval = null;
        let animationFrame = null;

        // ----- 初始化 / 重置 -----
        function resetGame() {
            // 清空旧循环
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }

            // 蛇：初始长度为 3，水平放置
            snake = [
                [9, 10],
                [8, 10],
                [7, 10]
            ];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            gameOver = false;
            updateScore();

            // 生成第一个食物（避开蛇身）
            generateFood();

            // 开始绘制
            draw();

            // 启动循环
            gameLoopInterval = setInterval(gameTick, TICK_INTERVAL_MS);
        }

        // ----- 食物生成 -----
        function generateFood() {
            const maxAttempts = 1000;
            for (let i = 0; i < maxAttempts; i++) {
                const fx = Math.floor(Math.random() * BOARD_SIZE);
                const fy = Math.floor(Math.random() * BOARD_SIZE);
                if (!snake.some(segment => segment[0] === fx && segment[1] === fy)) {
                    food = { x: fx, y: fy };
                    return;
                }
            }
            // 极端情况：蛇几乎占满，遍历所有格子
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (!snake.some(seg => seg[0] === x && seg[1] === y)) {
                        food = { x, y };
                        return;
                    }
                }
            }
            // 真满了 → 胜利！但贪吃蛇一般判赢，我们视为游戏胜利（即游戏结束且胜利）
            // 简化处理：若没有位置放食物，判定为胜利，但本实现保持简单，视为游戏结束。
            gameOver = true;
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }
        }

        // ----- 核心逻辑（每一步） -----
        function gameTick() {
            if (gameOver) return;

            // 应用有效方向
            const opposite = {
                'up': 'down',
                'down': 'up',
                'left': 'right',
                'right': 'left'
            };
            if (nextDirection && opposite[nextDirection] !== direction) {
                direction = nextDirection;
            }

            // 计算新头部
            const head = snake[0];
            let newHeadX = head[0];
            let newHeadY = head[1];
            switch (direction) {
                case 'right': newHeadX++; break;
                case 'left':  newHeadX--; break;
                case 'up':    newHeadY--; break;
                case 'down':  newHeadY++; break;
                default: return;
            }

            // 检查是否吃到食物
            const isEating = (newHeadX === food.x && newHeadY === food.y);

            // 构建新蛇
            let newSnake = [];
            newSnake.push([newHeadX, newHeadY]);
            // 如果吃到了，保留尾部（不删除最后一段）；否则去掉最后一段
            if (isEating) {
                // 保留原蛇全部
                newSnake = newSnake.concat(snake);
            } else {
                // 去掉最后一个元素
                newSnake = newSnake.concat(snake.slice(0, -1));
            }

            // 碰撞检测 (撞墙或撞自身)
            const headCollision = (
                newHeadX < 0 || newHeadX >= BOARD_SIZE || newHeadY < 0 || newHeadY >= BOARD_SIZE ||
                newSnake.slice(1).some(seg => seg[0] === newHeadX && seg[1] === newHeadY)
            );

            if (headCollision) {
                gameOver = true;
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
                draw(); // 立即绘制死亡状态
                return;
            }

            // 更新蛇
            snake = newSnake;

            // 处理食物
            if (isEating) {
                score++;
                updateScore();
                generateFood(); // 可能触发 gameOver（满盘）
                if (gameOver) {
                    // 如果生成食物时判定胜利，停止循环
                    if (gameLoopInterval) {
                        clearInterval(gameLoopInterval);
                        gameLoopInterval = null;
                    }
                }
            }

            // 绘制
            draw();
        }

        // ----- 绘制 -----
        function draw() {
            if (animationFrame) cancelAnimationFrame(animationFrame);
            animationFrame = requestAnimationFrame(() => {
                ctx.clearRect(0, 0, 400, 400);

                // 绘制网格（细线）
                ctx.strokeStyle = '#2a2a4a';
                ctx.lineWidth = 0.6;
                for (let i = 0; i <= BOARD_SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * CELL_SIZE, 0);
                    ctx.lineTo(i * CELL_SIZE, 400);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * CELL_SIZE);
                    ctx.lineTo(400, i * CELL_SIZE);
                    ctx.stroke();
                }

                // 绘制食物
                ctx.fillStyle = '#ff4757';
                ctx.shadowColor = '#ff4757';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                const fx = food.x * CELL_SIZE + CELL_SIZE/2;
                const fy = food.y * CELL_SIZE + CELL_SIZE/2;
                ctx.arc(fx, fy, CELL_SIZE/2 - 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // 绘制蛇
                snake.forEach((seg, index) => {
                    const [x, y] = seg;
                    const isHead = (index === 0);
                    const color = isHead ? '#2ecc71' : '#27ae60';
                    const gradient = ctx.createRadialGradient(
                        x * CELL_SIZE + 4, y * CELL_SIZE + 4, 2,
                        x * CELL_SIZE + 10, y * CELL_SIZE + 10, 12
                    );
                    gradient.addColorStop(0, isHead ? '#58d68d' : '#2ecc71');
                    gradient.addColorStop(1, isHead ? '#1e8449' : '#1a7a42');
                    ctx.fillStyle = gradient;
                    ctx.shadowColor = isHead ? '#2ecc71' : '#1a7a42';
                    ctx.shadowBlur = isHead ? 15 : 6;
                    ctx.beginPath();
                    ctx.roundRect(x * CELL_SIZE + 1, y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2, 4);
                    ctx.fill();
                    // 眼睛（头部）
                    if (isHead) {
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#f1f2f6';
                        let eyeOffsets = [];
                        switch (direction) {
                            case 'right': eyeOffsets = [[6,5], [6,12]]; break;
                            case 'left':  eyeOffsets = [[12,5], [12,12]]; break;
                            case 'up':    eyeOffsets = [[5,12], [12,12]]; break;
                            case 'down':  eyeOffsets = [[5,6], [12,6]]; break;
                            default: eyeOffsets = [[6,5], [6,12]];
                        }
                        eyeOffsets.forEach(([dx, dy]) => {
                            ctx.beginPath();
                            ctx.arc(x * CELL_SIZE + dx, y * CELL_SIZE + dy, 2.5, 0, 2 * Math.PI);
                            ctx.fill();
                        });
                        ctx.fillStyle = '#2d3436';
                        eyeOffsets.forEach(([dx, dy]) => {
                            ctx.beginPath();
                            ctx.arc(x * CELL_SIZE + dx + (direction === 'right' ? 1.5 : direction === 'left' ? -1.5 : 0),
                                    y * CELL_SIZE + dy + (direction === 'down' ? 1.5 : direction === 'up' ? -1.5 : 0),
                                    1.2, 0, 2 * Math.PI);
                            ctx.fill();
                        });
                    }
                });
                ctx.shadowBlur = 0;

                // 游戏结束覆盖层
                if (gameOver) {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, 0, 400, 400);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 32px "Segoe UI", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💀 游戏结束', 200, 180);
                    ctx.font = '18px sans-serif';
                    ctx.fillStyle = '#ccc';
                    ctx.fillText('点击 "新一局" 再玩一次', 200, 250);
                }
            });
        }

        // ----- 辅助：roundRect -----
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };

        // ----- 更新分数显示 -----
        function updateScore() {
            scoreSpan.textContent = score;
        }

        // ----- 键盘事件 -----
        function handleKeydown(e) {
            const key = e.key;
            e.preventDefault(); // 防止滚动

            if (gameOver) return;

            const keyMap = {
                'ArrowUp': 'up',
                'ArrowDown': 'down',
                'ArrowLeft': 'left',
                'ArrowRight': 'right'
            };
            const newDir = keyMap[key];
            if (!newDir) return;

            const opposite = {
                'up': 'down',
                'down': 'up',
                'left': 'right',
                'right': 'left'
            };
            // 禁止原地掉头
            if (direction !== opposite[newDir]) {
                nextDirection = newDir;
            }
        }

        // ----- 重启按钮 -----
        document.getElementById('restartBtn').addEventListener('click', function() {
            resetGame();
        });

        // ----- 启动游戏 -----
        window.addEventListener('load', () => {
            resetGame();
            window.addEventListener('keydown', handleKeydown);
        });

        // 清理（页面关闭时）
        window.addEventListener('beforeunload', function() {
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            if (animationFrame) cancelAnimationFrame(animationFrame);
        });

    })();
</script>
</body>
</html>
